name: Release

# A pushed vX.Y.Z tag builds every binary and the extension package and publishes them as a GitHub
# release. A manual run, or a pull request that touches the release files, builds and uploads them
# as workflow artifacts only (dry run, no release).
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src/scripts/release*.mjs
      - src/scripts/build-binary*.mjs
      - src/host/install/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  binary:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-26
          - target: macos-x64
            runner: macos-26-intel
          - target: windows-x64
            runner: windows-2025
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The official Node build of the runner's architecture, same major as CI: the binary embeds it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run build:binary
      - run: npm run smoke:binary

      # Fails when the runner's platform and architecture are not the target's.
      - name: Stage binary
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/release.mjs stage-binary "$TARGET" "$RUNNER_TEMP/release"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  extension:
    name: extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint

      - name: Package extension
        run: |
          set -euo pipefail
          name="$(node scripts/release.mjs extension-asset)"
          npm exec -- web-ext build --filename "$name" --overwrite-dest
          mkdir -p "$RUNNER_TEMP/release"
          mv "web-ext-artifacts/$name" "$RUNNER_TEMP/release/"

      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  release:
    name: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [binary, extension]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check tag against the versions
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node scripts/release.mjs check-tag "$TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/release
          merge-multiple: true

      - name: Write checksums
        run: node scripts/release.mjs checksums "$RUNNER_TEMP/release"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release.mjs notes "$VERSION" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/release/*
